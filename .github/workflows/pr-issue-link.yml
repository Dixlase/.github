name: Pull request links an issue

# Reusable check for "Issue first" (dixlase-core docs/development/issues.md).
# A pull request passes when its description links an issue (#N,
# owner/repo#N or an issue URL) or states an exemption on its own line:
#   No issue: security | release | signing | dependencies | generated | typo
# Text inside HTML comments is ignored, so template examples never count.
# Dependabot pull requests are exempt.
#
# Call it from a repository with:
#   jobs:
#     issue-link:
#       uses: Dixlase/.github/.github/workflows/pr-issue-link.yml@main

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Pass when a pull request body links an issue, or states an allowed exemption.
          set -euo pipefail
          author="${PR_AUTHOR:-}"
          if [ "$author" = "dependabot[bot]" ]; then
            echo "Dependabot pull request: exempt."
            exit 0
          fi
          # Drop HTML comments so the template's own examples do not count.
          body="$(printf '%s' "${PR_BODY:-}" | perl -0pe 's/<!--.*?-->//gs')"
          if printf '%s' "$body" | grep -Eqi '(^|[^&0-9A-Za-z_])([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+\b|github\.com/[^/ ]+/[^/ ]+/issues/[0-9]+'; then
            echo "Linked issue found."
            exit 0
          fi
          if printf '%s' "$body" | grep -Eqi '^[[:space:]>*-]*No issue:[[:space:]]*(security|release|signing|dependencies|generated|typo)\b'; then
            echo "Exemption stated: $(printf '%s' "$body" | grep -Eio 'No issue:[[:space:]]*[a-z]+' | head -1)"
            exit 0
          fi
          cat <<'MSG'
          ::error::This pull request does not link an issue.
          Open an issue first and reference it in the description (for example "Fixes #123").
          Exempt changes say so on their own line: "No issue: <reason>", where <reason> is one of
          security, release, signing, dependencies, generated, typo.
          See https://github.com/Dixlase/dixlase-core/blob/main/docs/development/issues.md#issue-first
          / Issue を先に立て、説明に "Fixes #123" のように書いてください。例外は "No issue: <理由>" を 1 行で。
          MSG
          exit 1
